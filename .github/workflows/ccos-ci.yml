name: CCOS CI
on:
  pull_request:
    paths: ["ccos/**", ".github/workflows/ccos-ci.yml"]
  push:
    branches: [main]
    paths: ["ccos/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ccos/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database RLS tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-contrib >/dev/null
          sudo chmod -R a+rX .
          npm run test:db
      - run: npm run build
      - name: Playwright
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
