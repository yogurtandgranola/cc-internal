name: CCOS CI
on:
  pull_request:
    paths: ["ccos/**", ".github/workflows/ccos-ci.yml"]
  push:
    branches: [main]
    paths: ["ccos/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ccos/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database RLS tests
        run: |
          # Use Postgres if the runner already has it. Otherwise install it, retrying because the apt mirror is sometimes unreachable.
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-contrib >/dev/null && break
              echo "apt attempt $attempt failed, retrying"; sleep $((attempt * 15))
            done
          fi
          sudo chmod -R a+rX .
          npm run test:db
      - run: npm run build
      - name: Playwright
        run: |
          # The runner already has the browser's system libraries. Only a few extra fonts come from apt, and apt is sometimes unreachable.
          # Try the full install with short apt timeouts. If apt is down, install the browser alone.
          printf 'Acquire::Retries "0";\nAcquire::http::Timeout "10";\nAcquire::https::Timeout "10";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          if ! npx playwright install --with-deps chromium; then
            echo "apt is unreachable. Installing the browser without extra system packages."
            npx playwright install chromium
          fi
          npm run test:e2e
