name: CCOS CI
on:
  pull_request:
    paths: ["ccos/**", ".github/workflows/ccos-ci.yml"]
  push:
    branches: [main]
    paths: ["ccos/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ccos/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database RLS tests
        run: |
          # Use Postgres if the runner already has it. Otherwise install it, retrying because the apt mirror is sometimes unreachable.
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-contrib >/dev/null && break
              echo "apt attempt $attempt failed, retrying"; sleep $((attempt * 15))
            done
          fi
          sudo chmod -R a+rX .
          npm run test:db
      - run: npm run build
      - name: Playwright
        run: |
          # The browser install downloads packages with apt, which is sometimes unreachable. Retry, then fail loudly.
          ok=0
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "browser install attempt $attempt failed, retrying"; sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "Browser install failed after 3 attempts"; exit 1; }
          npm run test:e2e
