<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cornell OS</title>
<style>
  :root{ color-scheme: light dark; --page:#f2f3ee; --surface:#fcfcfb; --ink:#14181a; --ink-2:#52564f; --border:rgba(20,24,26,.12); --accent:#1f5d6b; }
  @media (prefers-color-scheme: dark){ :root{ --page:#0c0e0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --border:rgba(255,255,255,.14); --accent:#5db6c7; } }
  *{ box-sizing:border-box } body{ margin:0; padding:0 16px; background:var(--page); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif }
  main{ max-width:960px; margin:0 auto; padding:40px 0 64px }
  .eyebrow{ font:500 11.5px ui-monospace,monospace; letter-spacing:.09em; text-transform:uppercase; color:var(--accent) }
  h1{ margin:6px 0 4px; font-size:28px } .sub{ color:var(--ink-2); margin:0 0 28px }
  .who{ font-size:13px; color:var(--ink-2); margin-bottom:24px }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px }
  a.card{ display:block; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px }
  a.card:hover{ border-color:var(--accent) } a.card h2{ margin:0 0 4px; font-size:17px } a.card p{ margin:0; color:var(--ink-2); font-size:13.5px }
  .tag{ display:inline-block; margin-top:10px; font:500 11px ui-monospace,monospace; color:var(--ink-2) }
  .msg{ color:var(--ink-2) }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Cornell Communities</div>
  <h1>Cornell OS</h1>
  <p class="sub">Dashboards for the deal, operations, and investor relations teams.</p>
  <div class="who" id="who">Loading&hellip;</div>
  <div class="grid" id="grid"></div>
</main>
<script src="storage.js"></script>
<script>
(async function(){
  const who = document.getElementById("who"), grid = document.getElementById("grid");
  let user = await window.CornellStorage.me();
  let local = false;
  if(!user){ user = { email:"local preview", roles:["admin"] }; local = true; }
  who.textContent = local ? "Local preview: showing every module." : "Signed in as " + user.email + " (" + (user.roles.join(", ") || "no role") + ")";
  let mods = [];
  try { mods = (await (await fetch("modules.json")).json()).modules; } catch(e){}
  const visible = mods.filter(m => user.roles.includes("admin") || m.roles.some(r => user.roles.includes(r)));
  if(visible.length === 0){
    const p = document.createElement("p"); p.className = "msg";
    p.textContent = "Your account is signed in but has no dashboards yet. Ask an admin to assign you a role.";
    grid.replaceWith(p); return;
  }
  visible.forEach(m => {
    const a = document.createElement("a"); a.className = "card"; a.href = m.path;
    const h = document.createElement("h2"); h.textContent = m.title;
    const d = document.createElement("p"); d.textContent = m.description || "";
    const t = document.createElement("span"); t.className = "tag"; t.textContent = m.roles.join(" · ");
    a.append(h, d, t); grid.appendChild(a);
  });
})();
</script>
</body>
</html>
